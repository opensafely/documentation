name: "Update Python dependencies"

on:
  workflow_dispatch:
  schedule:
    - cron: "16 7 * * MON"

permissions:
  contents: "read"

concurrency:
  group: "update-python-dependencies"
  cancel-in-progress: false

jobs:
  update-dependencies:
    name: "Update dependencies"
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - uses: "opensafely-core/setup-action@1f93a08c6e31a75b0908fcac5d25c2cf729c31f2" # v1.8.0
        with:
          python-version: "3.11"
          install-just: true

      - uses: "actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510" # v3.3.0
        id: "generate-token"
        with:
          client-id: "${{ vars.CREATE_PR_APP_ID }}"
          private-key: "${{ secrets.CREATE_PR_APP_PRIVATE_KEY }}"
          owner: "opensafely"
          repositories: "documentation"
          permission-contents: "write"
          permission-pull-requests: "write"

      - uses: "bennettoxford/update-dependencies-action@ee0450e084dc9b8ecce8d2988a9bb79e57844906" # v1
        id: "update"
        with:
          pr_label: "dependencies,python"
          token: "${{ steps.generate-token.outputs.token }}"
